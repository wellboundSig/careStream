AWSTemplateFormatVersion: '2010-09-09'
Description: HCHB duplicate-check bridge (no SAM required)

Parameters:
  AgentToken:
    Type: String
    NoEcho: true
  CareStreamToken:
    Type: String
    NoEcho: true
  CodeS3Bucket:
    Type: String
  CodeS3Key:
    Type: String
  JobTtlHours:
    Type: Number
    Default: 24

Resources:
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  JobsQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 60
      MessageRetentionPeriod: 3600
      ReceiveMessageWaitTimeSeconds: 20

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: HchbDupBridgeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: !GetAtt JobsTable.Arn
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt JobsQueue.Arn

  CreateJobFn:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: app.create_job
      Role: !GetAtt LambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
          QUEUE_URL: !Ref JobsQueue
          AGENT_TOKEN: !Ref AgentToken
          CARESTREAM_TOKEN: !Ref CareStreamToken
          JOB_TTL_HOURS: !Ref JobTtlHours

  GetJobFn:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: app.get_job
      Role: !GetAtt LambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
          QUEUE_URL: !Ref JobsQueue
          AGENT_TOKEN: !Ref AgentToken
          CARESTREAM_TOKEN: !Ref CareStreamToken
          JOB_TTL_HOURS: !Ref JobTtlHours

  AgentClaimFn:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: app.agent_claim
      Role: !GetAtt LambdaRole.Arn
      Timeout: 25
      MemorySize: 256
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
          QUEUE_URL: !Ref JobsQueue
          AGENT_TOKEN: !Ref AgentToken
          CARESTREAM_TOKEN: !Ref CareStreamToken
          JOB_TTL_HOURS: !Ref JobTtlHours

  AgentResultFn:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: app.agent_result
      Role: !GetAtt LambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
          QUEUE_URL: !Ref JobsQueue
          AGENT_TOKEN: !Ref AgentToken
          CARESTREAM_TOKEN: !Ref CareStreamToken
          JOB_TTL_HOURS: !Ref JobTtlHours

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-api'
      ProtocolType: HTTP

  CreateJobIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt CreateJobFn.Arn
      PayloadFormatVersion: '2.0'

  GetJobIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt GetJobFn.Arn
      PayloadFormatVersion: '2.0'

  AgentClaimIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AgentClaimFn.Arn
      PayloadFormatVersion: '2.0'

  AgentResultIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AgentResultFn.Arn
      PayloadFormatVersion: '2.0'

  CreateJobRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /jobs
      Target: !Sub 'integrations/${CreateJobIntegration}'

  GetJobRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /jobs/{job_id}
      Target: !Sub 'integrations/${GetJobIntegration}'

  AgentClaimRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /agent/claim
      Target: !Sub 'integrations/${AgentClaimIntegration}'

  AgentResultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /agent/result
      Target: !Sub 'integrations/${AgentResultIntegration}'

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: prod
      AutoDeploy: true

  CreateJobPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CreateJobFn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*'

  GetJobPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref GetJobFn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*'

  AgentClaimPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AgentClaimFn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*'

  AgentResultPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AgentResultFn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*'

Outputs:
  ApiBaseUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
  QueueUrl:
    Value: !Ref JobsQueue
  JobsTableName:
    Value: !Ref JobsTable
